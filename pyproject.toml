[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linshield"
version = "1.0.8"
description = "Open-source endpoint security suite for Linux — antivirus, quarantine, rootkit checks, file-integrity monitoring, with CLI and web GUI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LinShield contributors" }]
keywords = ["security", "antivirus", "linux", "malware", "yara", "endpoint", "edr", "clamav"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "click>=8.1",
    "flask>=3.0",
    "watchdog>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Recommended: richer CLI output and the YARA detection engine.
full = ["rich>=13.0", "yara-python>=4.3"]
rich = ["rich>=13.0"]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.3", "black>=24.0"]

[project.urls]
Homepage = "https://github.com/your-org/linshield"
Repository = "https://github.com/your-org/linshield"
Issues = "https://github.com/your-org/linshield/issues"

[project.scripts]
linshield = "linshield.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linshield*"]

[tool.setuptools.package-data]
"linshield.data.yara" = ["*.yar"]
"linshield.data" = ["*.json"]
"linshield.gui" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.black]
line-length = 90
target-version = ["py310"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
